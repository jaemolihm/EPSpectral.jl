name: CI
on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
permissions:
  actions: write
  contents: read
  # Codecov authenticates via OIDC instead of an upload token.
  id-token: write
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    env:
      JULIA_NUM_THREADS: "4,0"
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      # GitHub runners have no GPU: drop CUDA from the test target so Pkg.test neither installs
      # nor precompiles it. The GPU testsets load CUDA in a try/catch and skip without it.
      - name: Drop CUDA from the test target
        shell: julia --color=yes {0}
        run: |
          using TOML
          project = TOML.parsefile("Project.toml")
          delete!(project["extras"], "CUDA")
          delete!(project["compat"], "CUDA")
          filter!(!=("CUDA"), project["targets"]["test"])
          open(io -> TOML.print(io, project), "Project.toml", "w")
      # ElectronPhonon (unregistered) is resolved from GitHub via [sources] in Project.toml.
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      # Non-fatal: the upload needs the Codecov GitHub app to have access to this private repo.
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          use_oidc: true
          fail_ci_if_error: false
